<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CV — Rodrigo Fernández</title>
    <link rel="stylesheet" href="cv-print.css" />
  </head>
  <body>
    <article class="cv">
      <header class="cv-header">
        <h1 class="cv-name">{{NOMBRE}}</h1>
        <p class="cv-headline">{{TITULAR}}</p>
        <p class="cv-tagline">{{SUBTITULO_TECNICO}}</p>
        <p class="cv-contact">
          <span>{{UBICACION}}</span>
          <span>{{EMAIL}}</span>
          <span>{{LINKEDIN}}</span>
          <span>{{PORTFOLIO}}</span>
        </p>
        <p class="cv-availability">{{DISPONIBILIDAD}}</p>
      </header>

      <section class="cv-section"><h2>Sobre mí</h2><p>{{SOBRE_MI}}</p></section>
      <section class="cv-section"><h2>Experiencia profesional</h2></section>
      <section class="cv-section"><h2>Proyectos destacados</h2></section>
      <section class="cv-section"><h2>Formación</h2></section>
      <section class="cv-section"><h2>Tecnologías</h2></section>

      <div class="cv-footer-grid">
        <section class="cv-section"><h2>Certificaciones</h2></section>
        <section class="cv-section"><h2>Idiomas</h2></section>
      </div>
    </article>
  </body>
</html>
